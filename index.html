<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WT Tier Lab</title>
  <meta name="description" content="구글시트 기반 워썬더 장비 티어표 제작기. 지상, 공중, 해상 장비를 필터링하고 드래그해서 티어표를 만들 수 있습니다." />
  <meta name="theme-color" content="#111418" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WT Tier Lab" />
  <meta property="og:title" content="WT Tier Lab" />
  <meta property="og:description" content="워썬더 장비 티어표를 만들고 친구들과 공유하는 구글시트 기반 티어메이커." />
  <meta property="og:url" content="https://ninajalhe9.github.io/wt-tiermaker/" />
  <meta property="og:image" content="https://ninajalhe9.github.io/wt-tiermaker/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WT Tier Lab" />
  <meta name="twitter:description" content="워썬더 장비 티어표를 만들고 친구들과 공유하는 구글시트 기반 티어메이커." />
  <meta name="twitter:image" content="https://ninajalhe9.github.io/wt-tiermaker/preview.png" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='44'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">War Thunder Tiermaker</p>
      <h1>WT Tier Lab</h1>
      <p class="subtitle">구글시트 기반 워썬더 장비 티어표 제작기</p>
    </div>
    <div class="header-actions">
      <button id="saveBtn" class="ghost">저장</button>
      <button id="loadBtn" class="ghost">불러오기</button>
      <button id="resetBtn" class="danger">초기화</button>
    </div>
  </header>

  <main class="layout">
    <section class="controls panel">
      <div class="mode-tabs" role="tablist" aria-label="장비군 선택">
        <button class="mode-tab active" data-category="ground">지상</button>
        <button class="mode-tab" data-category="air">공중</button>
        <button class="mode-tab" data-category="naval">해상</button>
      </div>

      <div class="filter-grid">
        <label>
          검색
          <input id="searchInput" type="search" placeholder="장비명 검색" autocomplete="off" />
        </label>
        <label>
          국가
          <select id="nationFilter">
            <option value="all">전체</option>
          </select>
        </label>
        <label>
          타입
          <select id="typeFilter">
            <option value="all">전체</option>
          </select>
        </label>
        <label>
          태그
          <select id="tagFilter">
            <option value="all">전체</option>
          </select>
        </label>
      </div>

      <div class="rank-filter-block">
        <div class="rank-filter-title">랭크 필터</div>
        <div id="rankFilter" class="rank-filter" aria-label="랭크 필터"></div>
      </div>

      <div class="mini-actions">
        <button id="exportBtn">티어표 JSON 내보내기</button>
        <label class="import-label">
          JSON 가져오기
          <input id="importInput" type="file" accept="application/json" />
        </label>
      </div>
    </section>

    <section class="tier-panel panel" aria-label="티어표 영역">
      <div id="tierBoard" class="tier-board"></div>
    </section>

    <section class="pool-panel panel">
      <div class="pool-header">
        <h2>장비 풀</h2>
        <span id="countText">0개</span>
      </div>
      <div id="vehiclePool" class="vehicle-pool dropzone" data-tier="pool"></div>
    </section>
  </main>

  <template id="vehicleCardTemplate">
    <article class="vehicle-card" draggable="true">
      <div class="thumb-wrap">
        <img class="vehicle-image" alt="" loading="lazy" />
        <div class="fallback-thumb">WT</div>
      </div>
      <div class="vehicle-meta">
        <strong class="vehicle-name"></strong>
        <span class="vehicle-sub"></span>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
